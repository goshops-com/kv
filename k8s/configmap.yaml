apiVersion: v1
kind: ConfigMap
metadata:
  name: tieredkv-config
  labels:
    app: tieredkv
data:
  # Memory cache settings (<1 req/s per shard: a bigger L1 buys nothing)
  MEMORY_MAX_SIZE_MB: "256"
  MEMORY_MAX_ENTRIES: "500000"

  # RocksDB tuning
  ROCKSDB_BLOCK_CACHE_MB: "64"
  ROCKSDB_WRITE_BUFFER_MB: "32"
  ROCKSDB_MAX_WRITE_BUFFERS: "2"
  ROCKSDB_MAX_WAL_MB: "64"
  ROCKSDB_DB_WRITE_BUFFER_MB: "128"

  # Disk settings
  DISK_MAX_SIZE_GB: "50"
  DISK_MIGRATION_AGE_HOURS: "24"

  # Object storage (only used if Azure credentials are provided; see statefulset)
  S3_BUCKET: "tieredkv"
  S3_PREFIX: "data/"

  VIRTUAL_NODES: "150"
  SERVICE_NAME: "tieredkv"

  # Migration settings
  MIGRATION_BATCH_SIZE: "100"
  MIGRATION_THRESHOLD_PERCENT: "80"
  MIGRATION_INTERVAL_SECS: "60"

  # TTL rules: prefix:duration (keys not matching any rule live forever).
  # Changing this triggers a one-time rebuild of the expiry index on startup.
  TTL_RULES: "CAD/:7d"
  # The sweep reads only the due range of the expiry index; it is cheap to run often.
  TTL_CLEANUP_INTERVAL_SECS: "60"

  # Server settings
  HTTP_PORT: "8080"
  RUST_LOG: "info"
