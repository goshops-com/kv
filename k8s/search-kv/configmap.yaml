apiVersion: v1
kind: ConfigMap
metadata:
  name: search-kv-config
  labels:
    app: search-kv
data:
  SERVICE_NAME: "search-kv"
  HTTP_PORT: "8080"
  RUST_LOG: "info"
  VIRTUAL_NODES: "150"

  # Cache-only: no migration to object storage, misses never go to it
  CACHE_ONLY: "true"
  S3_BUCKET: "search-kv"
  S3_PREFIX: "data/"
  DISK_MAX_SIZE_GB: "45"
  DISK_MIGRATION_AGE_HOURS: "24"
  MIGRATION_BATCH_SIZE: "100"
  MIGRATION_INTERVAL_SECS: "60"
  MIGRATION_THRESHOLD_PERCENT: "80"

  MEMORY_MAX_SIZE_MB: "1024"
  MEMORY_MAX_ENTRIES: "250000"

  ROCKSDB_BLOCK_CACHE_MB: "512"
  ROCKSDB_CACHE_INDEX_AND_FILTER: "true"
  ROCKSDB_DB_WRITE_BUFFER_MB: "384"
  ROCKSDB_MAX_BACKGROUND_JOBS: "6"
  ROCKSDB_MAX_OPEN_FILES: "1500"
  ROCKSDB_MAX_WRITE_BUFFERS: "4"
  ROCKSDB_WRITE_BUFFER_MB: "96"
  # Blob GC relocates the live blobs of the oldest 5% of blob files on every
  # compaction of the values. It costs I/O (at 0.05 it rewrote the ~49GB value
  # set every ~6.5h), but 0 is not an option: it was tried from 2026-09-28 to
  # 2026-10-05 expecting blob files to die whole as their keys expire, and they
  # don't (one live key keeps a 256MB file). Nothing was reclaimed: both shards
  # went from ~45GB to ~157GB (70% garbage), 16GB a day, on 200GB volumes.
  # To spend less I/O try a value between 0 and 0.05, never 0, and watch
  # kv_rocksdb_property{name="rocksdb.live-blob-file-garbage-size"}.
  ROCKSDB_BLOB_GC_AGE_CUTOFF: "0.05"

  # Forced flush every N writes made tiny L0/blob files; the WAL is enough
  FLUSH_EVERY_N_WRITES: "0"
  RESERIALIZE_ON_STARTUP: "false"

  # The sweep reads only the due range of the expiry index
  TTL_CLEANUP_INTERVAL_SECS: "60"

  SCRUB_INTERVAL_SECS: "86400"
  SCRUB_TOTAL_SHARDS: "0"
