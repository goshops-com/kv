# search-kv: 2 cache-only shards behind search-kv-proxy (consistent hashing).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search-kv
  labels:
    app: search-kv
spec:
  serviceName: search-kv
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # Canary: with partition 1 only search-kv-1 picks up a new template. Set to 0
  # to roll search-kv-0 as well.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: search-kv
  template:
    metadata:
      labels:
        app: search-kv
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        agentpool: agentpool3
      containers:
        - name: search-kv
          image: goshops/kv:expiry-index-memfix-amd64-20260928
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: search-kv-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Return freed pages to the OS promptly (same as tieredkv)
            - name: _RJEM_MALLOC_CONF
              value: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
          # Measured 2026-09-28 after the expiry index: ~0.02-0.05 cores (was 0.27,
          # nearly all of it the full-scan TTL sweep) and ~1.25Gi anon (was
          # 2.7-5.3Gi). With both caches full (1GB L1 + 512MB block cache) anon
          # should settle near 2Gi. The limit bounds page cache: at 8Gi it filled
          # to ~6.7Gi and made `kubectl top` look like nothing changed.
          resources:
            requests:
              memory: "2Gi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-csi-premium-v2
        resources:
          requests:
            storage: 100Gi
