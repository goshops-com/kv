apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tieredkv
  labels:
    app: tieredkv
spec:
  serviceName: tieredkv
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: tieredkv
  template:
    metadata:
      labels:
        app: tieredkv
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        agentpool: qdrantpool
      containers:
        - name: tieredkv
          image: goshops/kv:expiry-index-amd64-20260928
          imagePullPolicy: IfNotPresent
          # The named port is what the tieredkv / tieredkv-lb services target
          # (targetPort: http). Without it both services have no endpoints.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tieredkv-config
            # No object-storage credentials on purpose: tieredkv runs cache-only
            # (everything on the local volume). Adding tieredkv-azure-credentials
            # here re-enables migration to Azure and object-tier reads on misses.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # No TOTAL_SHARDS: feature-store-v2 routes keys client-side
            # (KV_SHARDS=3), and the shards stay routing-agnostic.
            - name: _RJEM_MALLOC_CONF
              value: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
          # Measured 2026-09-28 after the expiry-index rollout: <1 req/s per pod,
          # ~1m CPU, ~0.1Gi anon. Worst-case anon with tieredkv-config is ~0.6Gi
          # (256MB L1 + 64MB block cache + 128MB memtables + allocator). Everything
          # above that is page cache over the ~8GB data dir, which the limit just
          # trims (and leaves to qdrant on the same pool).
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "1536Mi"
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-csi-premium-v2
        resources:
          requests:
            storage: 100Gi
